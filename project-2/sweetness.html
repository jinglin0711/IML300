<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Page</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-image: url('assets/poem.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
        cursor: url('assets/pen.png'), auto;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        cursor: url('assets/pen.png'), auto;
      }

      .text-content {
        position: fixed;
        top: 90%;
        left: 50%;
        z-index: 2;
        pointer-events: none;
      }

      .text-content a {
        pointer-events: all;
        cursor: url('assets/pen.png'), pointer;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="text-content">
      A minty drop on my back, <a href="walk.html">you</a> remind me that its time for goodbyes.
    </div>

    <script>
      function setup() {
        let canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent('canvas-container');
        clear();
      }

      function draw() {
        // Draw when mouse is pressed
        if (mouseIsPressed) {
          stroke(0);
          strokeWeight(3);
          line(mouseX, mouseY, pmouseX, pmouseY);
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
