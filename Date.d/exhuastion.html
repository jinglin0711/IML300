<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Page</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .phrase {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="phrase">
      what am I feeling right now? 
    </div>

    <script>
      let phrases = [
        "anxious",
        "overwhelmed",
        "Too worried about future",
        "tired",
        "stressed",
        "lost",
        "is it true?",
        "how do I know its true?",
        "numb",
        "fantisizing ",
        "scattered",
        "uncertain",
        "drained",
        "pattern to impress",
        "attention seeking",
        "perform",
        "not enough still",
        "self sabatage",
        "what if..",
        "should have..",
        "i feel lonely",
        "escape",
        "hope",
        "searching and waiting",
        "urge to give up",
        "always feel beind",
        "compete too much",
        "having to prove myself",
        "rushing",
        "running after time",
      ];
      
      let textObjects = [];
      let frameCounter = 0;
      let fonts = [];
      let fontsLoaded = false;

      function preload() {
        // Load your custom fonts here - replace with your actual font filenames
        fonts[0] = loadFont('assets/cursive.ttf');
        fonts[1] = loadFont('assets/font2.ttf');
        fonts[2] = loadFont('assets/font3.ttf');
        fonts[3] = loadFont('assets/font4.ttf');
      }

      function setup() {
        let canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent('canvas-container');
        textAlign(CENTER, CENTER);
        fontsLoaded = true;
      }

      function draw() {
        if (!fontsLoaded) return;
        
        if (movedX !== 0 || movedY !== 0) {
          frameCounter++;
          
          if (frameCounter % 3 === 0) {
            let randomPhrase = random(phrases);
            let randomSize = random(12, 68);
            let randomAngle = random(-15, 15);
            let randomFont = random(fonts); // Pick random font object
            
            textObjects.push({
              text: randomPhrase,
              x: mouseX + random(-30, 30),
              y: mouseY + random(-30, 30),
              size: randomSize,
              angle: randomAngle,
              opacity: 255,
              font: randomFont
            });
          }
        }
        
        // Draw all text objects
        for (let i = 0; i < textObjects.length; i++) {
          let obj = textObjects[i];
          
          push();
          translate(obj.x, obj.y);
          rotate(radians(obj.angle));
          
          textFont(obj.font);
          fill(0, 0, 0, obj.opacity);
          textSize(obj.size);
          text(obj.text, 0, 0);
          pop();
        }
      }
      
      function mousePressed() {
        window.location.href = 'stuck.html';
      }
      
      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
