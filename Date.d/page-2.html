<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML demo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow: hidden;
        background: white;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .content {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        padding: 20px;
      }

      .specialCenter {
        font-size: 24px;
        text-align: center;
        max-width: 800px;
        line-height: 1.8;
      }

      .specialCenter a {
        pointer-events: all;
        color: #333;
        text-decoration: none;
        transition: color 0.3s;
      }

      .specialCenter a:hover {
        color: #666;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="content">
      <div class="specialCenter">
       <div style="position: absolute; top: 50%; left: 45%; transform: translate(-50%, -50%); font-size: 32px; ">behind every date in my journal is a web of</div>
      <a href="exhuastion.html" class="word" style="position: absolute; top: 30%; left: 25%; font-size: 32px;">exhuastion.</a>
      <a href="sweetness.html" class="word" style="position: absolute; top: 60%; right: 10%; font-size: 32px;">sweetness.</a>
      <span class="word" style="position: absolute; bottom: 30%; left: 30%; font-size: 32px;">silence.</span>
      <span class="word" style="position: absolute; top: 20%; right: 82%; font-size: 32px;">hugs.</span>
      </div>
    </div>

    <script>
      let scratchImg;
      let overlayImg;
      let eraserSize = 50;
      
      function preload() {
        scratchImg = loadImage('assets/back1.png');
      }
      
      function setup() {
        let canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent('canvas-container');
        
        // Create overlay image from scratch image
        overlayImg = createImage(width, height);
        overlayImg.copy(scratchImg, 0, 0, scratchImg.width, scratchImg.height, 0, 0, width, height);
        overlayImg.loadPixels();
      }
      
      function draw() {
        background(255);
        
        // Erase pixels where mouse is pressed
        if (mouseIsPressed) {
          overlayImg.loadPixels();
          
          let radius = eraserSize / 2;
          for (let i = -radius; i < radius; i++) {
            for (let j = -radius; j < radius; j++) {
              let distance = sqrt(i * i + j * j);
              if (distance < radius) {
                let x = floor(mouseX + i);
                let y = floor(mouseY + j);
                
                if (x >= 0 && x < width && y >= 0 && y < height) {
                  let pixelIndex = (x + y * width) * 4;
                  // Reduce alpha by 10% each frame
                  overlayImg.pixels[pixelIndex + 3] = overlayImg.pixels[pixelIndex + 3] * 0.9;
                }
              }
            }
          }
          overlayImg.updatePixels();
        }
        
        // Draw the overlay image
        image(overlayImg, 0, 0);
      }
      
      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        overlayImg = createImage(width, height);
        overlayImg.copy(scratchImg, 0, 0, scratchImg.width, scratchImg.height, 0, 0, width, height);
        overlayImg.loadPixels();
      }
    </script>
  </body>
</html>
